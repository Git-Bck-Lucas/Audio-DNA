services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    container_name: audio-dna
    restart: unless-stopped
    depends_on:
      - db
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    env_file:
      - .env
    container_name: audio-dna-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: