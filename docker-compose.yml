services:
  app:
    build: .
    env_file:
      - .env
    container_name: audio-dna
    restart: unless-stopped
    ports:
      # Nur an localhost gebunden, nicht öffentlich -- Caddy bleibt der einzige
      # von außen erreichbare Eintrittspunkt (TLS). Reicht lokal fürs
      # Frontend-Dev gegen den dockerisierten Backend-Container.
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
  db:
    image: pgvector/pgvector:pg16
    ports:
      # Nur an localhost gebunden. Ohne das Präfix bindet Docker an 0.0.0.0 und
      # Postgres ist aus dem Internet erreichbar (auf dem Server verifiziert).
      # Die App braucht das Mapping gar nicht, sie erreicht die DB über das
      # interne Compose-Netz unter dem Hostnamen "db". Es existiert nur, damit
      # Alembic und die RAG-Skripte vom Host aus gegen localhost:5432 laufen.
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    container_name: audio-dna-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
  frontend-build:
    build: ./frontend
    volumes:
      - frontend_dist:/srv/frontend
    command: sh -c "cp -r /app/dist/. /srv/frontend/"
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - frontend_dist:/srv/frontend:ro
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully

volumes:
  postgres_data:
  caddy_data:
  frontend_dist:
