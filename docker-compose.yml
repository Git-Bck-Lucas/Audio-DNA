services:
  app:
    build: .
    env_file:
      - .env
    container_name: audio-dna
    restart: unless-stopped
    depends_on:
      - db
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    env_file:
      - .env
    container_name: audio-dna-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data: