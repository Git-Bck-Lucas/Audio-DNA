name: deployment
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SPOTIFY_CLIENT_ID: "test"
      SPOTIFY_CLIENT_SECRET: "test"
      ANTHROPIC_API_KEY: "test"
      DATABASE_URL: "sqlite:///test.db"
      POSTGRES_USER: "test"
      POSTGRES_PASSWORD: "test"
      POSTGRES_DB: "test"
      SESSION_SECRET_KEY: "test"
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      USER_ID_HASH_SECRET: ${{ secrets.USER_ID_HASH_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python 
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Requirements
        run: pip install -r requirements.txt
      - name: Pytest
        run: pytest
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host:  ${{ secrets.SERVER_HOST }}
          username:  ${{ secrets.SERVER_USER }}
          key:  ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            cd ~/Audio-DNA
            git pull origin main
            docker compose up -d --build
            # Warten bis Postgres Verbindungen annimmt (depends_on wartet nur auf Container-Start, nicht auf DB-Readiness)
            until docker compose exec -T db pg_isready >/dev/null 2>&1; do sleep 1; done
            # DB-Schema auf den neuesten Stand bringen (idempotent: tut nichts, wenn schon aktuell)
            docker compose exec -T app alembic -c backend/alembic.ini upgrade head